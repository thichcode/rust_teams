[package]
name = "rteams-meeting-assistant"
version = "0.4.1"
edition = "2024"

[dependencies]
eframe = "0.31"
egui = "0.31"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
directories = "5.0"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
async-trait = "0.1"
hound = "3.5"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
cpal = "0.13"
wasapi = "0.20"
winapi = { version = "0.3", features = ["namedpipeapi", "winbase", "synchapi"] }
