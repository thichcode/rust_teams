name: Build Windows EXE

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release EXE
        run: |
          cargo build --release
          $exeFiles = Get-ChildItem target/release/*.exe
          if ($exeFiles.Count -eq 0) {
            Write-Error "No .exe files found in target/release/"
            exit 1
          }
          Write-Host "Built EXE files:"
          $exeFiles | ForEach-Object { Write-Host "  - $($_.Name)" }

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-teams-win-x64
          path: target/release/*.exe
          retention-days: 7
