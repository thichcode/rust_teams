name: Simple Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Build
        run: cargo build

      - name: Check EXE
        run: |
          $exe = Get-ChildItem target/debug/*.exe
          if (-not $exe) { Write-Error "No EXE found"; exit 1 }
          Write-Host "Found EXE: $($exe.Name)"
