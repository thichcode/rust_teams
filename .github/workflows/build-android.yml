name: Build Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build APK (Android 6.0+)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Build debug APK
        run: |
          set -o pipefail
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "JAVA_HOME=$JAVA_HOME"
          ls -la $ANDROID_HOME/platforms/ 2>/dev/null || echo "No platforms dir"
          ls -la $ANDROID_HOME/build-tools/ 2>/dev/null || echo "No build-tools dir"
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log
          result=$?
          if [ $result -ne 0 ]; then
            {
              echo "### Build failed — last 80 lines of build.log"
              echo '```'
              tail -80 build.log
              echo '```'
            } >> $GITHUB_STEP_SUMMARY
            # Try to exfiltrate error output to public pastebin
            curl -s --data-binary @build.log https://paste.rs/ 2>/dev/null || \
              tail -80 build.log | curl -s -F 'f:1=<-' https://ix.io 2>/dev/null || \
              echo "pastebin failed"
            exit 1
          fi

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: mobile/android/build.log

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RTeams-android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Sign release APK
        if: env.ANDROID_KEYSTORE_BASE64 != '' && success()
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore.jks
          gradle assembleRelease --stacktrace --no-daemon
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/RTeams-${{ github.ref_name }}.apk

      - name: Upload signed APK (if released)
        if: env.ANDROID_KEYSTORE_BASE64 != '' && success()
        uses: actions/upload-artifact@v4
        with:
          name: RTeams-${{ github.ref_name }}.apk
          path: mobile/android/app/build/outputs/apk/release/RTeams-${{ github.ref_name }}.apk
