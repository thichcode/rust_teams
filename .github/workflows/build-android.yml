name: Build Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build APK (Android 6.0+)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install deps
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          sudo unzip -qo gradle-8.9-bin.zip -d /opt
          echo "export PATH=/opt/gradle-8.9/bin:\$PATH" >> ~/.bashrc
          export PATH=/opt/gradle-8.9/bin:$PATH
          gradle wrapper --gradle-version 8.9
          echo "=== CHECK ==="
          ls -la
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Build debug APK
        run: |
          export PATH=/opt/gradle-8.9/bin:$PATH
          gradle assembleDebug --stacktrace 2>&1 | tee ../build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then exit 1; fi

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: mobile/android/build.log

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RTeams-android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Sign release APK
        if: env.ANDROID_KEYSTORE_BASE64 != '' && success()
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export PATH=/opt/gradle-8.9/bin:$PATH
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore.jks
          ./gradlew assembleRelease --stacktrace
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/RTeams-${{ github.ref_name }}.apk

      - name: Upload signed APK (if released)
        if: env.ANDROID_KEYSTORE_BASE64 != '' && success()
        uses: actions/upload-artifact@v4
        with:
          name: RTeams-${{ github.ref_name }}.apk
          path: mobile/android/app/build/outputs/apk/release/RTeams-${{ github.ref_name }}.apk
