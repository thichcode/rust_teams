name: Build Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build APK (Android 6.0+)
    runs-on: ubuntu-latest
    container:
      image: mingc/android-build-box:latest

    steps:
      - uses: actions/checkout@v4

      - name: Build debug APK
        shell: bash
        working-directory: ${{ github.workspace }}/mobile/android
        run: |
          set -e
          echo "=== Java ==="
          java -version
          echo "=== Gradle ==="
          gradle --version
          echo "=== SDK ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms/"
          echo "=== Generate wrapper ==="
          gradle wrapper --gradle-version 8.9
          echo "=== Build ==="
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RTeams-android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Sign release APK
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        shell: bash
        working-directory: ${{ github.workspace }}/mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore.jks
          ./gradlew assembleRelease --stacktrace
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/RTeams-${{ github.ref_name }}.apk

      - name: Upload signed APK (if released)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: RTeams-${{ github.ref_name }}.apk
          path: mobile/android/app/build/outputs/apk/release/RTeams-${{ github.ref_name }}.apk
