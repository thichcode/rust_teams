name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build APK (Android 6.0+)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile/android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
          cache-read-only: false

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.9 --no-daemon

      - name: Build debug APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: mobile/android/build.log

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RTeams-android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Sign release APK
        if: env.ANDROID_KEYSTORE_BASE64 != '' && success()
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore.jks
          ./gradlew assembleRelease --no-daemon
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/RTeams-${{ github.ref_name }}.apk

      - name: Upload signed APK (if released)
        if: env.ANDROID_KEYSTORE_BASE64 != '' && success()
        uses: actions/upload-artifact@v4
        with:
          name: RTeams-${{ github.ref_name }}.apk
          path: mobile/android/app/build/outputs/apk/release/RTeams-${{ github.ref_name }}.apk

      - name: Upload APK to GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          APK="${{ github.workspace }}/mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          ASSET="RTeams-${TAG}-android.apk"
          cp "${APK}" "/tmp/${ASSET}"
          echo "Waiting for release ${TAG} to be created..."
          for i in $(seq 1 30); do
            if gh release view "${TAG}" --repo "${{ github.repository }}" &>/dev/null; then
              echo "Release found, uploading APK..."
              gh release upload "${TAG}" "/tmp/${ASSET}" --repo "${{ github.repository }}" --clobber
              echo "APK uploaded as ${ASSET}"
              exit 0
            fi
            echo "Attempt $i: release not ready yet, waiting..."
            sleep 10
          done
          echo "ERROR: Release ${TAG} was not created within 5 minutes"
          exit 1
