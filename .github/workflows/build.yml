name: Build Rust Teams

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release
        run: |
          cargo build --release
          if (!(Test-Path target/release/*.exe)) { Write-Error "No .exe built in target/release/" }
          mkdir -p artifacts || true
          $exeFile=(Get-ChildItem target/release -Filter *.exe)[0].FullName
          Copy-Item $exeFile artifacts/ -Force -ErrorAction Stop
          Get-ChildItem artifacts | ForEach-Object { Write-Host "FILE_PATH=$($_.FullName)" }
          $exeName = (Get-Item artifacts/*.exe).Name
          Add-Content -Path $env:GITHUB_ENV -Value "EXE_NAME=$exeName"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-teams-windows-x64
          path: artifacts/*.exe
          retention-days: 30