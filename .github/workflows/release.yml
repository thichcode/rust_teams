name: Auto Tag & Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check for Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.check.outputs.tag_name }}
      version: ${{ steps.check.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if release needed
        id: check
        shell: bash
        run: |
          # Get current version from Cargo.toml
          VERSION=$(grep '^version =' Cargo.toml | sed 's/version = "\(.*\)"/\1/' | head -1)
          TAG="v${VERSION}"
          echo "Current version: ${VERSION}"
          echo "Tag to check: ${TAG}"
          
          # Verify tag matches Cargo.toml version (triggered by tag push)
          PUSHED_TAG="${GITHUB_REF#refs/tags/}"
          if [ "${PUSHED_TAG}" = "${TAG}" ]; then
            echo "Tag matches version - proceeding with release"
            echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "Pushed tag ${PUSHED_TAG} doesn't match Cargo.toml version ${TAG} - skipping"
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build Release (Windows)
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Build (release)
        run: cargo build --release

      - name: Prepare release package
        shell: pwsh
        run: |
          Copy-Item target/release/rust_teams.exe rust_teams-windows-x64.exe
          Get-Item rust_teams-windows-x64.exe | Select-Object Name, Length

      - name: Sign executables
        if: env.CODE_SIGNING_CERT_BASE64 != ''
        shell: pwsh
        env:
          CODE_SIGNING_CERT_BASE64: ${{ secrets.CODE_SIGNING_CERT_BASE64 }}
          CODE_SIGNING_CERT_PASSWORD: ${{ secrets.CODE_SIGNING_CERT_PASSWORD }}
        run: |
          $certBytes = [Convert]::FromBase64String($env:CODE_SIGNING_CERT_BASE64)
          $certPath = "$env:RUNNER_TEMP\certificate.pfx"
          [System.IO.File]::WriteAllBytes($certPath, $certBytes)
          
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | 
            Select-Object -First 1 -ExpandProperty FullName
          
          if ($signtool) {
            & $signtool sign `
              /f $certPath `
              /p $env:CODE_SIGNING_CERT_PASSWORD `
              /tr http://timestamp.digicert.com `
              /td sha256 `
              /d "R Teams" `
              /du "https://github.com/thichcode/rust_teams" `
              rust_teams-windows-x64.exe
          } else {
            Write-Warning "signtool not found, skipping signing"
          }
          
          Remove-Item $certPath -Force -ErrorAction SilentlyContinue

      - name: Create zip
        shell: pwsh
        run: |
          Compress-Archive -Path rust_teams-windows-x64.exe -DestinationPath rust_teams-windows-x64.zip
          Get-Item *.exe, *.zip | Select-Object Name, Length

      - name: Generate checksums
        shell: pwsh
        run: |
          $files = @(
            @{ Name = "rust_teams-windows-x64.exe"; Hash = (Get-FileHash rust_teams-windows-x64.exe -Algorithm SHA256).Hash.ToLower() },
            @{ Name = "rust_teams-windows-x64.zip"; Hash = (Get-FileHash rust_teams-windows-x64.zip -Algorithm SHA256).Hash.ToLower() }
          )
          foreach ($f in $files) {
            "$($f.Hash)  $($f.Name)" | Out-File -Encoding ascii -NoNewline:$false "$($f.Name).sha256"
            Get-Content "$($f.Name).sha256"
          }

      - name: Upload main exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust_teams-windows-x64.exe
          path: rust_teams-windows-x64.exe
          retention-days: 90

      - name: Upload main zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust_teams-windows-x64.zip
          path: rust_teams-windows-x64.zip
          retention-days: 90

      - name: Upload checksum artifacts
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: |
            *.sha256
          retention-days: 90

  build-linux:
    name: Build Release (Linux)
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libxkbcommon-dev \
            libfontconfig1-dev \
            patchelf

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Build (release)
        run: cargo build --release

      - name: Prepare release package
        run: |
          # Copy binary
          cp target/release/rust_teams rust_teams-linux-x64
          # Create tar.gz archive
          tar czf rust_teams-linux-x64.tar.gz rust_teams-linux-x64
          ls -la rust_teams-linux-x64*

      - name: Build .deb package
        run: |
          VERSION=$(grep '^version =' Cargo.toml | sed 's/version = "\(.*\)"/\1/' | head -1)
          PKG_DIR="rust_teams_${VERSION}_amd64"
          mkdir -p "${PKG_DIR}/DEBIAN"
          mkdir -p "${PKG_DIR}/usr/bin"
          mkdir -p "${PKG_DIR}/usr/share/applications"
          mkdir -p "${PKG_DIR}/usr/share/icons/hicolor/256x256/apps"
          mkdir -p "${PKG_DIR}/usr/share/doc/rust_teams"

          cp target/release/rust_teams "${PKG_DIR}/usr/bin/rust_teams"
          cp linux/rust_teams.desktop "${PKG_DIR}/usr/share/applications/rust_teams.desktop"
          cp src/assets/icon_256.png "${PKG_DIR}/usr/share/icons/hicolor/256x256/apps/rust_teams.png"

          cat > "${PKG_DIR}/DEBIAN/control" << EOF
Package: rust-teams
Version: ${VERSION}
Section: net
Priority: optional
Architecture: amd64
Depends: libgtk-3-0 (>= 3.24), libwebkit2gtk-4.1-0 (>= 2.40), libjavascriptcoregtk-4.1-0 (>= 2.40), libappindicator3-1, librsvg2-2 (>= 2.52), libsoup-3.0-0 (>= 3.0), libxkbcommon0, libfontconfig1
Maintainer: thichcode <thichcode@users.noreply.github.com>
Description: Lightweight Microsoft Teams desktop client
 Unofficial Microsoft Teams client built with Rust and WebView.
 Features: memory optimization, auto-update, multi-profile,
 badge notifications, meeting popout, realtime translate.
Homepage: https://github.com/thichcode/rust_teams
EOF

          # Changelog
          date=$(date -u +"%a, %d %b %Y %H:%M:%S %z")
          cat > "${PKG_DIR}/usr/share/doc/rust_teams/changelog" << EOF
rust-teams (${VERSION}) unstable; urgency=medium

  * Linux build fixes and .deb packaging.

 -- thichcode <thichcode@users.noreply.github.com>  ${date}
EOF
          gzip -9 -n "${PKG_DIR}/usr/share/doc/rust_teams/changelog"

          dpkg-deb --build --root-owner-group "${PKG_DIR}"
          mv "${PKG_DIR}.deb" "rust-teams_${VERSION}_amd64.deb"
          ls -la "rust-teams_${VERSION}_amd64.deb"

      - name: Generate checksums
        run: |
          sha256sum rust_teams-linux-x64 > rust_teams-linux-x64.sha256
          sha256sum rust_teams-linux-x64.tar.gz > rust_teams-linux-x64.tar.gz.sha256
          sha256sum rust-teams_*.deb > rust-teams-linux-x64.deb.sha256
          cat *.sha256

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust_teams-linux-x64
          path: rust_teams-linux-x64
          retention-days: 90

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust_teams-linux-x64.tar.gz
          path: rust_teams-linux-x64.tar.gz
          retention-days: 90

      - name: Upload checksum artifacts
        uses: actions/upload-artifact@v4
        with:
          name: checksums-linux
          path: |
            *.sha256
          retention-days: 90

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-teams-linux-x64.deb
          path: rust-teams_*.deb
          retention-days: 90

  release:
    name: Create Release
    needs: [check, build, build-linux]
    runs-on: ubuntu-latest
    if: needs.check.outputs.should_release == 'true'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download exe artifact
        uses: actions/download-artifact@v4
        with:
          name: rust_teams-windows-x64.exe
          path: release

      - name: Download zip artifact
        uses: actions/download-artifact@v4
        with:
          name: rust_teams-windows-x64.zip
          path: release

      - name: Download checksum artifacts
        uses: actions/download-artifact@v4
        with:
          name: checksums
          path: release

      - name: Download Linux binary artifact
        uses: actions/download-artifact@v4
        with:
          name: rust_teams-linux-x64
          path: release

      - name: Download Linux archive artifact
        uses: actions/download-artifact@v4
        with:
          name: rust_teams-linux-x64.tar.gz
          path: release

      - name: Download Linux checksum artifacts
        uses: actions/download-artifact@v4
        with:
          name: checksums-linux
          path: release

      - name: Download .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: rust-teams-linux-x64.deb
          path: release

      - name: List release assets
        shell: bash
        run: ls -la release/

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          TAG="${{ needs.check.outputs.tag_name }}"
          VERSION="${{ needs.check.outputs.version }}"
          REPO="${{ github.repository }}"
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"
          
          # Write notes to file
          cat > /tmp/release_notes.md << EOFRN
          ## R Teams ${TAG}
          
          Version ${VERSION} - Latest features and improvements
          
          ### Download
          
          [rust_teams-windows-x64.exe](${BASE_URL}/rust_teams-windows-x64.exe) - Standalone executable (~5MB)
          
          [rust_teams-windows-x64.zip](${BASE_URL}/rust_teams-windows-x64.zip) - Compressed archive (~2MB)
          
            
            [rust_teams-linux-x64](${BASE_URL}/rust_teams-linux-x64) - Linux binary (requires WebKitGTK 4.1)
            
            [rust_teams-linux-x64.tar.gz](${BASE_URL}/rust_teams-linux-x64.tar.gz) - Linux compressed archive
            
            [rust-teams_${VERSION}_amd64.deb](${BASE_URL}/rust-teams_${VERSION}_amd64.deb) - Debian/Ubuntu package (.deb)
            
           ### Verify Download (SHA256)
          
          [rust_teams-windows-x64.exe.sha256](${BASE_URL}/rust_teams-windows-x64.exe.sha256)
          
          [rust_teams-windows-x64.zip.sha256](${BASE_URL}/rust_teams-windows-x64.zip.sha256)
          
            
            [rust_teams-linux-x64.sha256](${BASE_URL}/rust_teams-linux-x64.sha256)
            
            [rust_teams-linux-x64.tar.gz.sha256](${BASE_URL}/rust_teams-linux-x64.tar.gz.sha256)
            
            [rust-teams-linux-x64.deb.sha256](${BASE_URL}/rust-teams-linux-x64.deb.sha256)
            
           The in-app auto-updater verifies this checksum before installing an update.
          
          ### Features
          
          - WebView2 Engine - Lightweight Microsoft Teams client
          - **Memory Optimized** - Balanced profile saves ~250MB RAM vs default WebView2 (`--memory-profile safe|balanced|aggressive`)
          - Auto-Update - Seamless updates via GitHub Releases
          - Multi-Profile - Switch between Teams accounts
          - Badge Notifications - Unread message counter
          - Auto-Read - Mark messages with keywords as read
          - Smart Links - Open in running browser
          - Performance - Preconnect, idle GC hint, visibility-pause, content-visibility
          - Meeting Notes - Auto-detect and generate notes
          - Realtime Translate - Live transcription + translation + reply suggestions during calls
          - Local Whisper - Auto-downloads whisper.cpp binary + model on first run
          
          ### System Requirements
           
          **Windows:**
          - Windows 10/11 (64-bit)
          - WebView2 Runtime (pre-installed on Windows 11)
           
          **Linux:**
          - Ubuntu 22.04+ or equivalent
          - WebKitGTK 4.1 (`libwebkit2gtk-4.1-dev`)
          
          Built with Rust | Report Issues: https://github.com/${REPO}/issues
          EOFRN
          
          NOTES=$(cat /tmp/release_notes.md)
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag_name }}
          name: ${{ needs.check.outputs.tag_name }}
          body: ${{ steps.notes.outputs.notes }}
          files: |
            release/rust_teams-windows-x64.exe
            release/rust_teams-windows-x64.zip
            release/rust_teams-windows-x64.exe.sha256
            release/rust_teams-windows-x64.zip.sha256
            release/rust_teams-linux-x64
            release/rust_teams-linux-x64.tar.gz
            release/rust_teams-linux-x64.sha256
            release/rust_teams-linux-x64.tar.gz.sha256
            release/rust-teams_*.deb
            release/rust-teams-linux-x64.deb.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
