name: Auto Tag & Release

on:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  tag:
    name: Auto Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.tag.outputs.tag_name }}
      version: ${{ steps.tag.outputs.version }}
      should_release: ${{ steps.tag.outputs.should_release }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto increment version and create tag
        id: tag
        shell: bash
        run: |
          # Get current version from Cargo.toml
          CURRENT_VERSION=$(grep '^version =' Cargo.toml | sed 's/version = "\(.*\)"/\1/' | head -1)
          echo "Current version in Cargo.toml: ${CURRENT_VERSION}"
          
          # Find the latest tag
          LATEST_TAG=$(git tag -l "v*" --sort=-version:refname | head -n1)
          echo "Latest tag: ${LATEST_TAG:-none}"
          
          # Auto increment patch version
          if [ -z "$LATEST_TAG" ]; then
            # No tags exist, use current version
            NEW_VERSION="${CURRENT_VERSION}"
          else
            # Parse latest tag version
            LATEST_VERSION="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_VERSION"
            
            # Increment patch
            NEW_PATCH=$((PATCH + 1))
            NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          fi
          
          TAG="v${NEW_VERSION}"
          echo "New version: ${NEW_VERSION}"
          echo "New tag: ${TAG}"
          
          # Update Cargo.toml with new version
          sed -i "s/version = \"${CURRENT_VERSION}\"/version = \"${NEW_VERSION}\"/" Cargo.toml
          
          # Commit version bump
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml
          git commit -m "chore: bump version to ${NEW_VERSION}" || echo "No changes to commit"
          
          # Create and push tag
          git tag "${TAG}"
          git push origin "${TAG}"
          git push origin main
          
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "should_release=true" >> $GITHUB_OUTPUT

  build:
    name: Build Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Build (release)
        run: cargo build --release

      - name: Prepare release package
        shell: pwsh
        run: |
          # Copy exe with clean name
          Copy-Item target/release/rust_teams.exe rust_teams-windows-x64.exe
          # Create zip for download
          Compress-Archive -Path rust_teams-windows-x64.exe -DestinationPath rust_teams-windows-x64.zip
          # Show file sizes
          Get-Item *.exe, *.zip | Select-Object Name, Length

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust_teams-windows-x64.exe
          path: rust_teams-windows-x64.exe
          retention-days: 90

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust_teams-windows-x64.zip
          path: rust_teams-windows-x64.zip
          retention-days: 90

  release:
    name: Create Release
    needs: [tag, build]
    runs-on: ubuntu-latest
    if: needs.tag.outputs.should_release == 'true'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download exe artifact
        uses: actions/download-artifact@v4
        with:
          name: rust_teams-windows-x64.exe
          path: release

      - name: Download zip artifact
        uses: actions/download-artifact@v4
        with:
          name: rust_teams-windows-x64.zip
          path: release

      - name: List release assets
        shell: bash
        run: ls -la release/

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          TAG="${{ needs.tag.outputs.tag_name }}"
          VERSION="${{ needs.tag.outputs.version }}"
          REPO="${{ github.repository }}"
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"
          
          NOTES="# R Teams ${TAG}"
          NOTES+="\n\n### What's New"
          NOTES+="\n- Auto-incremented version to ${VERSION}"
          NOTES+="\n- Bug fixes and improvements"
          NOTES+="\n\n### Download"
          NOTES+="\n| File | Description |"
          NOTES+="\n|------|-------------|"
          NOTES+="\n| [rust_teams-windows-x64.exe](${BASE_URL}/rust_teams-windows-x64.exe) | Standalone executable |"
          NOTES+="\n| [rust_teams-windows-x64.zip](${BASE_URL}/rust_teams-windows-x64.zip) | Compressed archive |"
          NOTES+="\n\n### Features"
          NOTES+="\n- WebView2-based Microsoft Teams client"
          NOTES+="\n- Memory optimization (cache, GPU, animations)"
          NOTES+="\n- Auto-update via GitHub Releases"
          NOTES+="\n- Multi-profile support"
          NOTES+="\n- Badge notifications for unread messages"
          NOTES+="\n- In-app link navigation (no Edge redirect)"
          NOTES+="\n\n### Requirements"
          NOTES+="\n- Windows 10/11"
          NOTES+="\n- WebView2 Runtime (built-in on Windows 11)"
          echo "notes=${NOTES}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag_name }}
          name: ${{ needs.tag.outputs.tag_name }}
          body: ${{ steps.notes.outputs.notes }}
          files: |
            release/rust_teams-windows-x64.exe
            release/rust_teams-windows-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
