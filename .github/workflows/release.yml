name: Auto Tag & Release

on:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  tag:
    name: Auto Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.tag.outputs.tag_name }}
      should_release: ${{ steps.tag.outputs.should_release }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version and check changes
        id: tag
        shell: bash
        run: |
          VERSION=$(grep '^version =' Cargo.toml | sed 's/version = "\(.*\)"/\1/' | head -1)
          TAG="v${VERSION}"
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
          
          # Check if tag already exists
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists"
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "Creating tag: ${TAG}"
            git tag "${TAG}"
            git push origin "${TAG}"
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Build (release)
        run: cargo build --release

      - name: Prepare release package
        shell: pwsh
        run: |
          # Copy exe with clean name
          Copy-Item target/release/rust_teams.exe rust_teams-windows-x64.exe
          # Create zip for download
          Compress-Archive -Path rust_teams-windows-x64.exe -DestinationPath rust_teams-windows-x64.zip
          # Show file sizes
          Get-Item *.exe, *.zip | Select-Object Name, Length

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust_teams-windows-x64.exe
          path: rust_teams-windows-x64.exe
          retention-days: 90

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust_teams-windows-x64.zip
          path: rust_teams-windows-x64.zip
          retention-days: 90

  release:
    name: Create Release
    needs: [tag, build]
    runs-on: ubuntu-latest
    if: needs.tag.outputs.should_release == 'true'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download exe artifact
        uses: actions/download-artifact@v4
        with:
          name: rust_teams-windows-x64.exe
          path: release

      - name: Download zip artifact
        uses: actions/download-artifact@v4
        with:
          name: rust_teams-windows-x64.zip
          path: release

      - name: List release assets
        shell: bash
        run: ls -la release/

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          TAG="${{ needs.tag.outputs.tag_name }}"
          NOTES="# Rust Teams ${TAG}"
          NOTES+="\n\n### 📦 Download"
          NOTES+="\n- **Windows x64:** \`rust_teams-windows-x64.exe\` (standalone)"
          NOTES+="\n- **Windows x64 (zip):** \`rust_teams-windows-x64.zip\` (compressed)"
          NOTES+="\n\n### ⚡ Features"
          NOTES+="\n- WebView2-based Microsoft Teams client"
          NOTES+="\n- Memory optimization (cache, GPU, animations)"
          NOTES+="\n- Auto-update via GitHub Releases"
          NOTES+="\n- Multi-profile support"
          NOTES+="\n\n### 🔧 Requirements"
          NOTES+="\n- Windows 10/11"
          NOTES+="\n- WebView2 Runtime (built-in on Windows 11)"
          echo "notes=${NOTES}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag_name }}
          name: ${{ needs.tag.outputs.tag_name }}
          body: ${{ steps.notes.outputs.notes }}
          files: |
            release/rust_teams-windows-x64.exe
            release/rust_teams-windows-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
