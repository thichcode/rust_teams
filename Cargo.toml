[package]
name = "rust_teams"
version = "0.7.4"
edition = "2024"  # Latest Rust edition (2024)

[features]
default = ["memory-optimized"]
memory-optimized = []

[dependencies]
# Window management (tao is a fork of winit used by wry)
tao = { version = "0.35", features = ["serde"] }

# WebView rendering (uses WebView2 on Windows)
wry = { version = "0.55", features = ["devtools"], default-features = false }

# Config & Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
env_logger = "0.11"
log = "0.4"

# Utilities
directories = "4.0"

# Auto-update (rustls to avoid OpenSSL CVEs)
reqwest = { version = "0.12", features = ["json", "blocking", "rustls-tls", "multipart"], default-features = false }
semver = "1.0"

# Date/time handling
chrono = "0.4"

# Regex for parsing unread count
regex = "1.0"

# Meeting notes - Ollama client
ollama-rs = "0.3"

# Meeting notes - Audio format
hound = "3.5"

# Meeting notes - UUID for filenames
uuid = { version = "1", features = ["v4"] }

# Meeting notes - Async runtime
tokio = { version = "1", features = ["full"] }

# Meeting notes - Async trait
async-trait = "0.1"

# Whisper download - zip extraction
zip = { version = "2", default-features = false, features = ["deflate"] }

# Windows-specific dependencies
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "shellapi", "winbase", "processthreadsapi", "wincon"] }
cpal = "0.13"
# WASAPI bindings for system audio loopback capture
wasapi = "0.20"
