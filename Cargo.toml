[workspace]
members = ["rteams-meeting-assistant"]

[package]
name = "rust_teams"
version = "0.9.52"
edition = "2024"  # Latest Rust edition (2024)

[features]
default = ["memory-optimized"]
memory-optimized = []
dioxus-shell = ["dioxus", "dioxus-desktop", "webbrowser"]

[[bin]]
name = "rust-teams-dioxus"
path = "src/bin/rust_teams_dioxus.rs"
required-features = ["dioxus-shell"]

[dependencies]
# Window management (tao is a fork of winit used by wry)
tao = { version = "0.35", features = ["serde"] }

# WebView rendering (uses WebView2 on Windows)
wry = { version = "0.55", features = ["devtools"], default-features = false }

# Config & Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
env_logger = "0.11"
log = "0.4"

# Utilities
directories = "4.0"

# Auto-update (Schannel on Windows, OpenSSL on Linux — no rustls to ensure system proxy/TLS compatibility)
reqwest = { version = "0.12", features = ["json", "blocking", "multipart"] }
semver = "1.0"

# Date/time handling
chrono = "0.4"

# Regex for parsing unread count
regex = "1.0"

# Checksum verification for auto-update downloads
sha2 = "0.10"

# Windows-specific dependencies
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "shellapi", "winbase", "processthreadsapi", "wincon"] }

# Dioxus shell UI (optional, build with --features dioxus-shell)
dioxus = { version = "0.7", features = ["desktop"], optional = true }
dioxus-desktop = { version = "0.7", optional = true }
webbrowser = { version = "1.0", optional = true }


