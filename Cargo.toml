[package]
name = "rust_teams"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core WebView2 support for Windows
webview2-com = { version = "0.20.0", features = ["winrt"] }

# Window management
winit = { version = "0.29.0", features = ["default"] }

# Config & Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
env_logger = "0.9"
log = "0.4"

# Utilities
once_cell = "1.0"
parking_lot = "0.12"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2.0"
regex = "1.0"
directories = "4.0"

[build-dependencies]
# For Windows resource file (icon, version info)
winres = "0.1"

[package.metadata.winres]
OriginalFilename = "RustTeams.exe"
FileDescription = "Lightweight Microsoft Teams Lite Wrapper"
ProductVersion = "0.1.0"
LegalCopyright = "Copyright (C) 2026"
