[package]
name = "rust_teams"
version = "0.1.5"
edition = "2021"

[features]
default = ["memory-optimized"]
memory-optimized = []

[dependencies]
# Window management (tao is a fork of winit used by wry)
tao = { version = "0.35", features = ["serde"] }

# WebView rendering (uses WebView2 on Windows)
wry = { version = "0.55", features = ["devtools"], default-features = false }

# Config & Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
env_logger = "0.11"
log = "0.4"

# Utilities
directories = "4.0"

# Auto-update (rustls to avoid OpenSSL CVEs)
reqwest = { version = "0.12", features = ["json", "blocking", "rustls-tls"], default-features = false }
semver = "1.0"

# Windows API (for taskbar badge and notifications)
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "shellapi", "winbase", "processthreadsapi"] }

# Regex for parsing unread count
regex = "1.0"
