[package]
name = "rust_teams"
version = "0.1.0"
edition = "2021"

[dependencies]
webview2-com = "0.20.0"
winit = "0.29.0"
notify-rust = "4.8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.9"
once_cell = "1.0"
parking_lot = "0.12"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2.0"
regex = "1.0"
directories = "4.0"
image = "0.24"
clipboard = "0.5"
open = "5.0"

# TODO: use native Windows API for Tray Item instead (win32/winit tray bindings)
# tray_item = "0.10" # skip for now

[build-dependencies]
# windows-bindgen = "0.1"

[package.metadata.winres]
OriginalFilename = "RustTeams.exe"
FileDescription = "Lightweight Microsoft Teams Lite Wrapper"
ProductVersion = "0.1.0"